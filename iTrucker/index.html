<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iTrucker | App Under Development</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --background: #131313;
      --on-background: #e5e2e1;
      --surface-container-high: #2a2a2a;
      --on-surface: #e5e2e1;
      --on-surface-variant: #d8c3ad;
      --tertiary: #8fd5ff;
      --tertiary-container: #1abdff;
      --cyan-glow: rgba(26, 189, 255, 0.28);
      --radius-default: 0.5rem;
      --radius-xl: clamp(1rem, 2vw, 1.5rem);
      --radius-full: 9999px;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--background);
      color: var(--on-surface);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: absolute;
      width: clamp(350px, 50vw, 650px);
      height: clamp(350px, 50vw, 650px);
      background: radial-gradient(circle, var(--tertiary-container), transparent 70%);
      border-radius: var(--radius-full);
      filter: blur(140px);
      opacity: 0.25;
      pointer-events: none;
    }

    .box {
      position: relative;
      z-index: 10;
      background: rgba(31, 41, 55, 0.4);
      border: 1px solid rgba(26, 189, 255, 0.3);
      border-radius: var(--radius-xl);
      padding: clamp(36px, 5vw, 56px) clamp(24px, 4vw, 40px);
      max-width: 520px;
      width: 100%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(26, 189, 255, 0.12);
      border: 1px solid rgba(26, 189, 255, 0.3);
      border-radius: var(--radius-full);
      color: var(--tertiary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .icon {
      font-size: 64px;
      color: var(--tertiary-container);
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      font-weight: 800;
      margin: 0 0 16px 0;
      letter-spacing: -0.02em;
      color: var(--on-surface);
    }

    p {
      color: var(--on-surface-variant);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      background: rgba(26, 189, 255, 0.15);
      color: var(--tertiary);
      border: 1px solid rgba(26, 189, 255, 0.35);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: var(--radius-default);
      transition: transform var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .btn:hover {
      background: rgba(26, 189, 255, 0.25);
      border-color: var(--tertiary-container);
      box-shadow: 0 4px 20px var(--cyan-glow);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="box">
    <span class="material-symbols-outlined icon">construction</span>
    <div>
      <span class="badge">
        <span class="material-symbols-outlined" style="font-size: 14px;">engineering</span>
        UNDER DEVELOPMENT
      </span>
    </div>
    <h1>App Under Development</h1>
    <p>The <strong>iTrucker</strong> fleet dispatch and driver operations system is currently undergoing active deployment and testing. Signal sync will be online shortly.</p>
    <a href="../" class="btn">
      <span class="material-symbols-outlined">arrow_back</span>
      <span>Back to Portal</span>
    </a>
  </div>
</body>
</html>
